<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Permit</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f6f8fb;
      color: #1f2937;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 25px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      text-decoration: none;
      color: #315fa8;
      font-weight: 600;
      font-size: 14px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .documents {
      display: grid;
      gap: 16px;
    }

    .document-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      transition: 0.2s ease;
    }

    .document-card:hover {
      box-shadow: 0 8px 24px rgba(31,41,55,0.08);
      transform: translateY(-2px);
    }

    .document-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .pdf-icon {
      width: 45px;
      height: 45px;
      background: #fff1f0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .document-card h3 {
      font-size: 16px;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .document-card p {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.45;
    }

    .open-btn {
      text-decoration: none;
      background: #315fa8;
      color: white;
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    @media (max-width: 650px) {
      .document-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <a href="./index.html" class="back">
      ← Back to Home
    </a>

    <h1>Work Permit</h1>

    <p class="subtitle">
      Access UAE regulations relating to work permits, job offers and employment contract forms.
    </p>

    <div class="documents">

      <div class="document-card">

        <div class="document-info">

          <div class="pdf-icon">📕</div>

          <div>
            <h3>Ministerial Decree No. (46) of 2022</h3>

            <p>
              Regarding Work Permits, Job Offers and Employment Contract Forms
            </p>
          </div>

        </div>

        <a
          href="./documents/Work-Permit/Ministerial-Decree-No--46--of-2022-Regarding-Work-Permits-Job-Offers-and-Employment-Contracts-Forms.pdf"
          target="_blank"
          class="open-btn">
          Open PDF
        </a>

      </div>

    </div>

  </main>

</body>
</html>
